logger:
    file:
      path: /open5gs/install/var/log/open5gs/smf1.log

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: MAX_NUM_UE
  parameter:
      no_ipv4v6_local_addr_in_packet_filter: true

smf:
    freeDiameter: /open5gs/install/etc/freeDiameter/smf.conf
    sbi:
      server:
        - address: SMF1_IP
          port: 7777
      client:
        nrf:
          - uri: http://NRF_IP:7777
        scp:
          - uri: http://SCP_IP:7777
    gtpc:
      server:
        - address: SMF1_IP
    gtpu:
      server:
        - address: SMF1_IP
    pfcp:
      server:
        - address: SMF1_IP
      client:
        upf:
          - address: UPF1_IP
    session:
      - subnet: SLICE1_IPV4_SUBNET
        gateway: SLICE1_IPV4_GATEWAY
        dnn: internet
    dns:
      - SMF_DNS1
      - SMF_DNS2
    p-cscf:
      - PCSCF_IP
    mtu: 1450
    metrics:
      server:
        - address: SMF1_IP
          port: 9091
