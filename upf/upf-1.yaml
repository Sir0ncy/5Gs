logger:
    file:
      path: /open5gs/install/var/log/open5gs/upf1.log

global:
  max:
    ue: MAX_NUM_UE

upf:
    pfcp:
      server:
        - address: UPF1_IP
      client:
        smf:
          - address: SMF1_IP
    gtpu:
      server:
        - address: UPF1_IP
          advertise: UPF1_IP
    session:
      - subnet: SLICE1_IPV4_SUBNET
        gateway: SLICE1_IPV4_GATEWAY
        dnn: internet
        dev: UPF1_INTERNET_APN_IF_NAME
    metrics:
      server:
        - address: UPF1_IP
          port: 9091