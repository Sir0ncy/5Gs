logger:
    file:
      path: /open5gs/install/var/log/open5gs/upf2.log

global:
  max:
    ue: MAX_NUM_UE

upf:
    pfcp:
      server:
        - address: UPF2_IP
      client:
        smf:
          - address: SMF2_IP
    gtpu:
      server:
        - address: UPF2_IP
          advertise: UPF2_IP
    session:
      - subnet: SLICE2_IPV4_SUBNET
        gateway: SLICE2_IPV4_GATEWAY
        dnn: internet
        dev: UPF2_INTERNET_APN_IF_NAME
    metrics:
      server:
        - address: UPF2_IP
          port: 9091
